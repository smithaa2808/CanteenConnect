<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Tracking | Canteen Connect</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><header class="head"><h1>Canteen Connect</h1><p>Member 4 — Order Tracking</p></header><nav class="nav"><a href="/order-tracking.html">Track Order</a><a href="/order-history.html">Order History</a><a href="/notifications.html">Notifications</a><a href="/feedback.html">Feedback & Rating</a></nav><section class="card"><h2>Create a demo order</h2><label>Items summary</label><input id="items" value="Veg sandwich x 1, Lemon juice x 1"><button onclick="createOrder()">Place Demo Order</button><p id="message"></p></section><section class="card"><h2>Track an order</h2><label>Order ID</label><div class="row"><input id="orderId" placeholder="Example: CC12345"><button onclick="loadOrder()">Find Order</button></div><div id="result"></div><div class="row"><select id="status"><option>Order Placed</option><option>Accepted</option><option>Preparing</option><option>Ready for Pickup</option><option>Picked Up</option></select><button onclick="updateStatus()">Update Status (demo)</button></div><p class="muted">In a real deployment, only authorized canteen staff should update statuses.</p></section></main><script>
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Request failed');return data}function msg(t,cls=''){document.getElementById('message').textContent=t;document.getElementById('message').className=cls}async function createOrder(){try{const o=await api('/api/orders',{method:'POST',body:JSON.stringify({itemSummary:document.getElementById('items').value})});document.getElementById('orderId').value=o.orderId;document.getElementById('status').value=o.status;msg('Order placed: '+o.orderId,'success');await loadOrder()}catch(e){msg(e.message,'error')}}async function loadOrder(){const id=document.getElementById('orderId').value.trim();if(!id)return msg('Enter an order ID.','error');try{const o=await api('/api/orders/'+encodeURIComponent(id));document.getElementById('status').value=o.status;document.getElementById('result').innerHTML='<p><b>Order ID:</b> '+safe(o.orderId)+'</p><p><b>Items:</b> '+safe(o.itemSummary)+'</p><p><b>Current status:</b> <span class="status">'+safe(o.status)+'</span></p><p class="muted">Created: '+safe(o.createdAt||'')+'</p>';msg('Order loaded.','success')}catch(e){document.getElementById('result').textContent='';msg(e.message,'error')}}async function updateStatus(){const id=document.getElementById('orderId').value.trim();try{const o=await api('/api/orders/'+encodeURIComponent(id)+'/status',{method:'PATCH',body:JSON.stringify({status:document.getElementById('status').value})});msg('Status updated to '+o.status,'success');await loadOrder()}catch(e){msg(e.message,'error')}}function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
