<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Connect | Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #202938;
        }

        header {
            background: #183b32;
            color: white;
            padding: 24px 7%;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #d9e8df;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            font-size: 15px;
        }

        input {
            flex: 1;
            min-width: 200px;
        }

        select {
            min-width: 170px;
        }

        #status {
            color: #596579;
            margin-bottom: 18px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .food-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 10px #00000008;
        }

        .food-card h3 {
            margin: 0 0 10px;
        }

        .category {
            color: #64748b;
            font-size: 13px;
        }

        .price {
            font-size: 21px;
            font-weight: bold;
            margin: 14px 0;
        }

        .tag {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            background: #e5f6e9;
            color: #176534;
            font-size: 12px;
        }

        .tag.non-veg {
            background: #ffebe8;
            color: #a62e20;
        }

        .details-btn {
            display: block;
            width: 100%;
            margin-top: 16px;
            padding: 10px;
            border: 0;
            border-radius: 7px;
            background: #183b32;
            color: white;
            cursor: pointer;
        }

        .details-btn:hover {
            background: #285747;
        }

        .empty {
            padding: 30px;
            text-align: center;
            background: white;
            border-radius: 10px;
        }

        .food-image {
            height: 120px;
            background: #edf4ef;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            margin-bottom: 16px;
        }
        }
    </style>
</head>

<body>
    <header>
        <h1>🍽️ Canteen Connect</h1>
        <p>Explore the menu and find your next meal.</p>
    </header>

    <main>
        <div class="filters">
            <input type="search" id="search" placeholder="Search food..." aria-label="Search food">

            <select id="category" aria-label="Filter by category">
                <option value="All">All Categories</option>
                <option value="Chinese">Chinese</option>
                <option value="Chat">Chat</option>
                <option value="South Indian">South Indian</option>
            </select>

            <select id="dietary" aria-label="Filter by dietary preference">
                <option value="All">All Food Types</option>
                <option value="Veg">Vegetarian Only</option>
                <option value="NonVeg">Non-Vegetarian Only</option>
            </select>
        </div>

        <p id="status">Loading menu...</p>
        <section id="menu" class="menu-grid"></section>
    </main>

    <script>
        const menu = document.getElementById("menu");
        const status = document.getElementById("status");
        const search = document.getElementById("search");
        const category = document.getElementById("category");
        const dietary = document.getElementById("dietary");

        let foodItems = [];

        async function loadMenu() {
            try {
                const response = await fetch("/api/food-items");

                if (!response.ok) {
                    throw new Error("Could not load menu.");
                }

                foodItems = await response.json();
                renderMenu();
            } catch (error) {
                status.textContent =
                    "Unable to load the menu. Make sure the backend is running.";
                console.error(error);
            }
        }

        function renderMenu() {

            const query = search.value.trim().toLowerCase();
            const selectedCategory = category.value;
            const selectedDietary = dietary.value;

            const filteredItems = foodItems.filter(item => {
                const matchesName =
                    (item.name || "").toLowerCase().includes(query);

                const matchesCategory =
                    selectedCategory === "All" ||
                    (item.category || "").toLowerCase() ===
                    selectedCategory.toLowerCase();

                const matchesDietary =
                    selectedDietary === "All" ||
                    (selectedDietary === "Veg" &&
                        item.vegetarian === true) ||
                    (selectedDietary === "NonVeg" &&
                        item.vegetarian === false);

                return matchesName && matchesCategory && matchesDietary;
            });

            status.textContent =
                `${filteredItems.length} food item(s) found`;

            menu.replaceChildren();

            if (filteredItems.length === 0) {
                const message = document.createElement("p");
                message.className = "empty";
                message.textContent = "No food items found.";
                menu.appendChild(message);
                return;
            }

            filteredItems.forEach(item => {
                const card = document.createElement("article");
                card.className = "food-card";

                const image = document.createElement("div");
                image.className = "food-image";

                const foodName = (item.name || "").toLowerCase();

                if (foodName.includes("pizza")) {
                    image.textContent = "🍕";
                } else if (foodName.includes("burger")) {
                    image.textContent = "🍔";
                } else if (foodName.includes("chicken")) {
                    image.textContent = "🍗";
                } else if (
                    foodName.includes("tea") ||
                    foodName.includes("coffee")
                ) {
                    image.textContent = "☕";
                } else if (
                    foodName.includes("idli") ||
                    foodName.includes("dosa") ||
                    foodName.includes("dosai")
                ) {
                    image.textContent = "🥞";
                } else if (
                    foodName.includes("samosa") ||
                    foodName.includes("puri") ||
                    foodName.includes("chaat")
                ) {
                    image.textContent = "🥙";
                } else if (
                    foodName.includes("rice") ||
                    foodName.includes("noodles")
                ) {
                    image.textContent = "🍜";
                } else {
                    image.textContent = "🍽️";
                }

                const name = document.createElement("h3");
                name.textContent = item.name || "Unnamed item";

                const categoryText = document.createElement("p");
                categoryText.className = "category";
                categoryText.textContent = item.category || "Other";

                const price = document.createElement("p");
                price.className = "price";
                price.textContent = `₹${item.price}`;

                const tag = document.createElement("span");
                tag.className = item.vegetarian
                    ? "tag"
                    : "tag non-veg";
                tag.textContent = item.vegetarian
                    ? "Vegetarian"
                    : "Non-vegetarian";

                const availability = document.createElement("p");
                availability.textContent = item.available
                    ? "✅ Available"
                    : "❌ Currently unavailable";

                availability.style.fontSize = "13px";
                availability.style.marginTop = "10px";
                availability.style.color =
                    item.available ? "#176534" : "#a62e20";

                const detailsButton = document.createElement("button");
                detailsButton.className = "details-btn";
                detailsButton.textContent = "View Details";

                detailsButton.addEventListener("click", () => {
                    window.location.href =
                        `/food-details.html?id=${encodeURIComponent(item.id)}`;
                });

                card.append(
                    image,
                    name,
                    categoryText,
                    price,
                    tag,
                    availability,
                    detailsButton
                );

                menu.appendChild(card);
            });
        }


        search.addEventListener("input", renderMenu);
        category.addEventListener("change", renderMenu);
        dietary.addEventListener("change", renderMenu);

        loadMenu();
    </script>
</body>

</html>
