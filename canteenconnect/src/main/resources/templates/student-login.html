
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | CanteenConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f4f2;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-box {
            background: #ffffff;
            padding: 35px;
            width: min(400px, 100%);
            border-radius: 15px;
            box-shadow: 0 5px 25px #00000015;
        }

        h2 {
            color: #218838;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            color: #333333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cccccc;
            border-radius: 7px;
            font-size: 15px;
            background: #ffffff;
            color: #333333;
        }

        input:focus {
            outline: 2px solid #218838;
            border-color: #218838;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #218838;
            color: #ffffff;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #17692a;
        }

        a {
            color: #218838;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 0;
        }

        .error {
            color: #b42318;
            background: #fff0f0;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>🎓 Student Login</h2>

    <p class="error" id="errorMessage" hidden></p>

    <form action="/login/student" method="post">

        <label for="studentId">Student ID</label>

        <input
            type="text"
            id="studentId"
            name="studentId"
            placeholder="Enter your student ID"
            autocomplete="username"
            required>

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

        <button type="submit">Login</button>

    </form>

    <p class="back">
        <a href="/">← Back to Home</a>
    </p>

</div>

</body>
</html>
