
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu | CanteenConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f1;
            color: #26352b;
        }

        header {
            background: #247447;
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        nav {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .heading h2 {
            color: #247447;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .heading p {
            color: #68756c;
        }

        .search-box {
            display: block;
            width: 100%;
            max-width: 550px;
            margin: 25px auto;
            padding: 14px;
            border: 1px solid #cbd5cd;
            border-radius: 9px;
            font-size: 16px;
            outline-color: #247447;
        }

        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }

        .filter-btn {
            padding: 11px 20px;
            background: white;
            border: 1px solid #247447;
            color: #247447;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: #247447;
            color: white;
        }

        .stall-heading {
            color: #247447;
            margin: 35px 0 18px;
            padding-bottom: 10px;
            border-bottom: 2px solid #cbd8cd;
            font-size: 25px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .food-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px #0000000d;
            transition: transform 0.2s;
        }

        .food-card:hover {
            transform: translateY(-4px);
        }

        .food-image {
            height: 100px;
            background: #e2e8e3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
        }

        .food-details {
            padding: 16px;
        }

        .food-details h4 {
            margin: 0 0 8px;
            font-size: 17px;
            min-height: 38px;
            color: #26352b;
        }

        .stall-label {
            display: inline-block;
            font-size: 11px;
            background: #e0f1e5;
            color: #247447;
            padding: 5px 8px;
            border-radius: 5px;
            margin-bottom: 8px;
        }

        .price {
            color: #247447;
            font-size: 21px;
            font-weight: bold;
            margin: 12px 0;
        }

        .add-button {
            width: 100%;
            padding: 12px;
            background: #247447;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-button:hover {
            background: #195b35;
        }

        .message {
            display: none;
            background: #dff2e4;
            color: #195b35;
            padding: 13px;
            border-radius: 7px;
            margin: 15px auto;
            text-align: center;
            max-width: 550px;
        }

        .empty-message {
            display: none;
            text-align: center;
            padding: 30px;
            color: #68756c;
        }

        footer {
            text-align: center;
            padding: 22px;
            margin-top: 45px;
            background: #e2e7e2;
            color: #56635a;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            nav {
                justify-content: center;
            }

            .heading h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<header class="menu-header">
    <a href="/" class="brand">
        <span class="brand-icon">🍽️</span>
        <span>CanteenConnect</span>
    </a>

    <nav class="menu-nav">
        <a href="/">Home</a>
        <a href="/menu">Menu</a>
        <a href="/cart">Cart (<span id="cartCount">0</span>)</a>
        <a href="/my-orders">My Orders</a>
    </nav>
</header>


<main class="container">

    <section class="heading">
        <h2>Our Food Menu 🍽️</h2>
        <p>Explore your campus canteens and order your favourite food.</p>
    </section>

    <input
        type="search"
        id="searchInput"
        class="search-box"
        placeholder="🔍 Search for food items..."
        aria-label="Search food items">

    <div class="filters">
        <button class="filter-btn active" data-stall="all">All Items</button>
        <button class="filter-btn" data-stall="tiffin">Tiffin Stall</button>
        <button class="filter-btn" data-stall="chat">Chat</button>
        <button class="filter-btn" data-stall="chinese">Chinese Stall</button>
    </div>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <div id="menuContainer"></div>

    <p id="emptyMessage" class="empty-message">
        No food items found. Try another search.
    </p>

</main>

<footer>
    <p>© 2026 CanteenConnect | Campus Food Ordering System</p>
</footer>

        {id: 323, name: "Veg Macaroni", price: 80, stall: "chinese", emoji: "🍝"},
        {id: 324, name: "Veg Noodles", price: 80, stall: "chinese", emoji: "🍜"},
        {id: 325, name: "Veg Pasta", price: 80, stall: "chinese", emoji: "🍝"}
    ];

    const stallNames = {
        tiffin: "Tiffin Stall",
        chat: "Chat",
        chinese: "Chinese Stall"
    };

    let activeStall = "all";

    function getCart() {
        try {
            const cart = JSON.parse(localStorage.getItem("canteenCart"));
            return Array.isArray(cart) ? cart : [];
        } catch (error) {
            return [];
        }
    }

    function saveCart(cart) {
        localStorage.setItem("canteenCart", JSON.stringify(cart));
    }

    function updateCartCount() {
        const cart = getCart();

        const count = cart.reduce(function(total, item) {
            return total + Number(item.quantity || 0);
        }, 0);

        document.getElementById("cartCount").textContent = count;
    }

    function renderMenu() {
        const search = document.getElementById("searchInput")
            .value.trim().toLowerCase();

        const container = document.getElementById("menuContainer");
        const emptyMessage = document.getElementById("emptyMessage");

        container.innerHTML = "";

        let visibleCount = 0;

        const stalls = ["tiffin", "chat", "chinese"];

        stalls.forEach(function(stall) {
            if (activeStall !== "all" && activeStall !== stall) {
                return;
            }

            const items = menuItems.filter(function(item) {
                return item.stall === stall &&
                    item.name.toLowerCase().includes(search);
            });

            if (items.length === 0) {
                return;
            }

            visibleCount += items.length;

            const heading = document.createElement("h3");
            heading.className = "stall-heading";
            heading.textContent = stallNames[stall];

            const grid = document.createElement("section");
            grid.className = "menu-grid";

            items.forEach(function(item) {
                const card = document.createElement("article");
                card.className = "food-card";

                const image = document.createElement("div");
                image.className = "food-image";
                image.textContent = item.emoji;
                image.setAttribute("aria-hidden", "true");

                const details = document.createElement("div");
                details.className = "food-details";

                const name = document.createElement("h4");
                name.textContent = item.name;

                const label = document.createElement("span");
                label.className = "stall-label";
                label.textContent = stallNames[item.stall];

                const price = document.createElement("p");
                price.className = "price";
                price.textContent = "₹" + item.price.toFixed(2);

                const button = document.createElement("button");
                button.className = "add-button";
                button.textContent = "＋ Add to Cart";
                button.type = "button";

                button.addEventListener("click", function() {
                    addToCart(item);
                });

                details.appendChild(label);
                details.appendChild(name);
                details.appendChild(price);
                details.appendChild(button);

                card.appendChild(image);
                card.appendChild(details);

                grid.appendChild(card);
            });

            container.appendChild(heading);
            container.appendChild(grid);
        });

        emptyMessage.style.display = visibleCount === 0 ? "block" : "none";
    }

    function addToCart(item) {
        const cart = getCart();

        const existingItem = cart.find(function(cartItem) {
            return Number(cartItem.id) === item.id;
        });

        if (existingItem) {
            existingItem.quantity =
                Number(existingItem.quantity || 0) + 1;
        } else {
            cart.push({
                id: item.id,
                name: item.name,
                price: item.price,
                quantity: 1
            });
        }

        saveCart(cart);
        updateCartCount();

        const message = document.getElementById("message");
        message.textContent = item.name + " added to your cart!";
        message.style.display = "block";

        window.clearTimeout(window.cartMessageTimer);

        window.cartMessageTimer = window.setTimeout(function() {
            message.style.display = "none";
        }, 2500);
    }

    document.querySelectorAll(".filter-btn").forEach(function(button) {
        button.addEventListener("click", function() {
            document.querySelectorAll(".filter-btn").forEach(function(btn) {
                btn.classList.remove("active");
            });

            button.classList.add("active");
            activeStall = button.dataset.stall;
            renderMenu();
        });
    });

    document.getElementById("searchInput")
        .addEventListener("input", renderMenu);

    updateCartCount();
    renderMenu();
</script>

</body>
</html>
