
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart | CanteenConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f1;
            color: #26352b;
        }

        header {
            background: #247447;
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand {
            color: white;
            text-decoration: none;
            font-size: 26px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
        }

        h2 {
            color: #247447;
            text-align: center;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #68756c;
            margin-bottom: 30px;
        }

        .cart-box {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px #0000000d;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #e1e6e1;
        }

        .item-name {
            font-size: 17px;
            font-weight: bold;
        }

        .item-price {
            color: #68756c;
            font-size: 14px;
            margin-top: 6px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-controls button {
            width: 32px;
            height: 32px;
            border: none;
            background: #e0eee4;
            color: #247447;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
        }

        .quantity-controls button:hover {
            background: #c9e2d1;
        }

        .item-total {
            min-width: 85px;
            text-align: right;
            font-weight: bold;
            color: #247447;
        }

        .remove-button {
            margin-top: 7px;
            background: none;
            border: none;
            color: #c0392b;
            cursor: pointer;
        }

        .summary {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #e1e6e1;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 12px 0;
        }

        .grand-total {
            font-size: 22px;
            font-weight: bold;
            color: #247447;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .button {
            display: inline-block;
            padding: 13px 20px;
            border-radius: 7px;
            text-decoration: none;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .continue-button {
            background: #e7eae7;
            color: #26352b;
        }

        .checkout-button {
            background: #247447;
            color: white;
        }

        .checkout-button:hover {
            background: #195b35;
        }

        .empty-cart {
            text-align: center;
            padding: 35px 10px;
        }

        .empty-cart .emoji {
            font-size: 60px;
        }

        .empty-cart p {
            color: #68756c;
            margin-bottom: 25px;
        }

        footer {
            text-align: center;
            padding: 22px;
            margin-top: 40px;
            background: #e2e7e2;
            color: #56635a;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            .cart-box {
                padding: 16px;
            }

            .cart-item {
                grid-template-columns: 1fr auto;
                gap: 12px;
            }

            .item-total {
                grid-column: 1 / -1;
                text-align: left;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="menu-header">
    <a href="/" class="brand">
        <span class="brand-icon">🍽️</span>
        <span>CanteenConnect</span>
    </a>

    <nav class="menu-nav">
        <a href="/">Home</a>
        <a href="/menu">Menu</a>
        <a href="/cart">Cart (<span id="cartCount">0</span>)</a>
        <a href="/my-orders">My Orders</a>
    </nav>
</header>

<main class="container">

    <h2>🛒 My Shopping Cart</h2>
    <p class="subtitle">Review your selected food items before checkout.</p>

    <section class="cart-box">

        <div id="cartItems"></div>

        <div id="cartSummary" class="summary" hidden>
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">₹0.00</span>
            </div>

            <div class="summary-row grand-total">
                <span>Total</span>
                <span id="grandTotal">₹0.00</span>
            </div>

            <div class="actions">
                <a href="/menu" class="button continue-button">
                    ← Continue Shopping
                </a>

                <button type="button"
                        class="button checkout-button"
                        onclick="goToCheckout()">
                    Proceed to Checkout →
                </button>
            </div>
        </div>

    </section>

</main>

<footer>
    <p>© 2026 CanteenConnect | Campus Food Ordering System</p>
</footer>

<script>
    function getCart() {
        try {
            const savedCart = JSON.parse(
                localStorage.getItem("canteenCart")
            );

            return Array.isArray(savedCart) ? savedCart : [];
        } catch (error) {
            return [];
        }
    }

    function saveCart(cart) {
        localStorage.setItem("canteenCart", JSON.stringify(cart));
    }

    function formatPrice(amount) {
        return "₹" + Number(amount).toFixed(2);
    }

    function updateCartCount() {
        const cart = getCart();

        const count = cart.reduce(function(total, item) {
            return total + Math.max(0, Number(item.quantity) || 0);
        }, 0);

        document.getElementById("cartCount").textContent = count;
    }

    function renderCart() {
        const cart = getCart();
        const cartItems = document.getElementById("cartItems");
        const cartSummary = document.getElementById("cartSummary");

        cartItems.innerHTML = "";

        if (cart.length === 0) {
            cartSummary.hidden = true;

            cartItems.innerHTML = `
                <div class="empty-cart">
                    <div class="emoji">🛒</div>
                    <h3>Your cart is empty!</h3>
                    <p>Add your favourite food from the menu to get started.</p>
                    <a href="/menu" class="button checkout-button">
                        Browse Food Menu
                    </a>
                </div>
            `;

            updateCartCount();
            return;
        }

        let subtotal = 0;

        cart.forEach(function(item, index) {
            const quantity = Math.max(
                1,
                parseInt(item.quantity, 10) || 1
            );

            const price = Math.max(0, Number(item.price) || 0);
            const itemTotal = price * quantity;

            subtotal += itemTotal;

            const row = document.createElement("div");
            row.className = "cart-item";

            const details = document.createElement("div");

            const name = document.createElement("div");
            name.className = "item-name";
            name.textContent = item.name || "Food Item";

            const unitPrice = document.createElement("div");
            unitPrice.className = "item-price";
            unitPrice.textContent = formatPrice(price) + " each";

            const removeButton = document.createElement("button");
            removeButton.type = "button";
            removeButton.className = "remove-button";
            removeButton.textContent = "Remove";
            removeButton.addEventListener("click", function() {
                removeItem(index);
            });

            details.appendChild(name);
            details.appendChild(unitPrice);
            details.appendChild(removeButton);

            const controls = document.createElement("div");
            controls.className = "quantity-controls";

            const decrease = document.createElement("button");
            decrease.type = "button";
            decrease.textContent = "−";
            decrease.setAttribute("aria-label", "Decrease quantity");
            decrease.addEventListener("click", function() {
                changeQuantity(index, -1);
            });

            const quantityText = document.createElement("span");
            quantityText.textContent = quantity;

            const increase = document.createElement("button");
            increase.type = "button";
            increase.textContent = "+";
            increase.setAttribute("aria-label", "Increase quantity");
            increase.addEventListener("click", function() {
                changeQuantity(index, 1);
            });

            controls.appendChild(decrease);
            controls.appendChild(quantityText);
            controls.appendChild(increase);

            const total = document.createElement("div");
            total.className = "item-total";
            total.textContent = formatPrice(itemTotal);

            row.appendChild(details);
            row.appendChild(controls);
            row.appendChild(total);

            cartItems.appendChild(row);
        });

        document.getElementById("subtotal").textContent =
            formatPrice(subtotal);

        document.getElementById("grandTotal").textContent =
            formatPrice(subtotal);

        cartSummary.hidden = false;
        updateCartCount();
    }

    function changeQuantity(index, change) {
        const cart = getCart();

        if (!cart[index]) {
            return;
        }

        cart[index].quantity =
            (parseInt(cart[index].quantity, 10) || 1) + change;

        if (cart[index].quantity <= 0) {
            cart.splice(index, 1);
        }

        saveCart(cart);
        renderCart();
    }

    function removeItem(index) {
        const cart = getCart();

        cart.splice(index, 1);

        saveCart(cart);
        renderCart();
    }

    function goToCheckout() {
        const cart = getCart();

        if (cart.length === 0) {
            alert("Your cart is empty. Please add food items first.");
            return;
        }

        window.location.href = "/checkout";
    }

    renderCart();
</script>

</body>
</html>
