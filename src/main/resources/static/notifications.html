<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | Canteen Connect</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><header class="head"><h1>Canteen Connect</h1><p>Member 4 — Notifications</p></header><nav class="nav"><a href="/order-tracking.html">Track Order</a><a href="/order-history.html">Order History</a><a href="/notifications.html">Notifications</a><a href="/feedback.html">Feedback & Rating</a></nav><section class="card"><h2>Notifications</h2><button onclick="loadNotifications()">Refresh</button><ul id="list"></ul><p id="message"></p></section></main><script>async function loadNotifications(){const list=document.getElementById('list');try{const r=await fetch('/api/notifications');const data=await r.json();if(!r.ok)throw Error(data.error||'Could not load notifications');list.innerHTML='';if(!data.length){list.innerHTML='<li>No notifications yet. Place a demo order to generate one.</li>';return}data.forEach(n=>{const li=document.createElement('li');li.textContent=n.message+' — '+n.createdAt+(n.readStatus?' (Read)':' (Unread) ');if(!n.readStatus){const b=document.createElement('button');b.textContent='Mark read';b.onclick=async()=>{try{const rr=await fetch('/api/notifications/'+n.id+'/read',{method:'PATCH'});if(!rr.ok)throw Error('Could not mark as read');loadNotifications()}catch(e){document.getElementById('message').textContent=e.message}};li.appendChild(b)}list.appendChild(li)})}catch(e){document.getElementById('message').textContent=e.message}}loadNotifications();</script></body></html>
