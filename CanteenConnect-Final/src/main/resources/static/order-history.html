<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order History | Canteen Connect</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><header class="head"><h1>Canteen Connect</h1><p>Member 4 — Order History</p></header><nav class="nav"><a href="/order-tracking.html">Track Order</a><a href="/order-history.html">Order History</a><a href="/notifications.html">Notifications</a><a href="/feedback.html">Feedback & Rating</a></nav><section class="card"><h2>Previous orders</h2><p class="muted">Completed orders appear here after their status becomes Picked Up.</p><button onclick="loadHistory()">Refresh History</button><ul id="list"></ul><p id="message"></p></section></main><script>async function loadHistory(){const list=document.getElementById('list');try{const r=await fetch('/api/order-history');const data=await r.json();if(!r.ok)throw Error(data.error||'Could not load history');list.innerHTML='';if(!data.length){list.innerHTML='<li>No completed orders yet. Use Track Order to create and complete a demo order.</li>';return}data.forEach(o=>{const li=document.createElement('li');li.textContent='#'+o.orderId+' — '+o.itemSummary+' — '+o.finalStatus+' — '+o.completedAt+' ';const b=document.createElement('button');b.textContent='Reorder';b.onclick=async()=>{try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itemSummary:o.itemSummary})});const d=await r.json();if(!r.ok)throw Error(d.error||'Reorder failed');document.getElementById('message').textContent='Reorder placed: '+d.orderId+'. Open Track Order to view it.'}catch(e){document.getElementById('message').textContent=e.message}};li.appendChild(b);list.appendChild(li)})}catch(e){document.getElementById('message').textContent=e.message}}loadHistory();</script></body></html>
