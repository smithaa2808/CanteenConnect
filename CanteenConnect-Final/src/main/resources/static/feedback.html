<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback & Rating | Canteen Connect</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><header class="head"><h1>Canteen Connect</h1><p>Member 4 — Feedback & Rating</p></header><nav class="nav"><a href="/order-tracking.html">Track Order</a><a href="/order-history.html">Order History</a><a href="/notifications.html">Notifications</a><a href="/feedback.html">Feedback & Rating</a></nav><section class="card"><h2>Submit feedback</h2><form id="form"><label for="orderId">Order ID</label><input id="orderId" required placeholder="Example: CC12345"><label for="rating">Rating</label><select id="rating"><option value="5">5 — Excellent</option><option value="4">4 — Very good</option><option value="3">3 — Good</option><option value="2">2 — Needs improvement</option><option value="1">1 — Poor</option></select><label for="comments">Comments</label><textarea id="comments" required maxlength="500" placeholder="Tell us about your order"></textarea><button type="submit">Submit Feedback</button></form><p id="message"></p></section><section class="card"><h2>Submitted feedback</h2><button onclick="loadFeedback()">Refresh</button><ul id="list"></ul></section></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const message=document.getElementById('message');try{const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:document.getElementById('orderId').value,comments:document.getElementById('comments').value,rating:Number(document.getElementById('rating').value)})});const d=await r.json();if(!r.ok)throw Error(d.error||'Submission failed');message.textContent='Feedback submitted successfully.';document.getElementById('comments').value='';loadFeedback()}catch(err){message.textContent=err.message}});async function loadFeedback(){try{const r=await fetch('/api/feedback');const data=await r.json();if(!r.ok)throw Error('Could not load feedback');const list=document.getElementById('list');list.innerHTML='';if(!data.length){list.innerHTML='<li>No feedback submitted yet.</li>';return}data.forEach(f=>{const li=document.createElement('li');li.textContent='#'+f.orderId+' — '+f.comments+' — '+f.submittedAt;list.appendChild(li)})}catch(e){document.getElementById('message').textContent=e.message}}loadFeedback();</script></body></html>
